org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Release signing is injected from environment / CI secrets (never commit keys):
#   IVRTOP_KEYSTORE_FILE, IVRTOP_KEYSTORE_PASSWORD, IVRTOP_KEY_ALIAS, IVRTOP_KEY_PASSWORD
# Setup links (no server): https://ivr.top/dialer/android?user=…&pass=… open the app directly.
ivrtop.appLinkHost=ivr.top
ivrtop.appLinkPath=/dialer/android
ivrtop.defaultSipDomain=sip.ivr.top
# Only these SIP domains may be configured from a link (anti-hijack). Comma-separated.
ivrtop.linkAllowedDomains=sip.ivr.top
