# IVRTOP Dialer – version catalog
# Verified against official release notes on 2026-11-26:
#   AGP 9.2.0 (min Gradle 9.4.1, bundled KGP 2.3.10), Hilt/Dagger 2.59.x (AGP 9 support),
#   Room 2.8.x (last 2.x line), Compose BOM 2026.08.00 (Material3 1.4 stable).
# Other versions = latest known stable; Android Studio "Project Structure > Suggestions" will flag newer ones.

[versions]
agp = "9.2.0"
kotlin = "2.3.10"
ksp = "2.3.4"
hilt = "2.59.1"
hiltAndroidx = "1.3.0"
composeBom = "2026.08.00"
activityCompose = "1.11.0"
coreKtx = "1.17.0"
coreTelecom = "1.0.1"
coreSplash = "1.2.0"
lifecycle = "2.9.4"
navigation = "2.9.5"
room = "2.8.4"
datastore = "1.1.7"
work = "2.10.5"
biometric = "1.1.0"
appcompat = "1.7.1"
coroutines = "1.10.2"
serialization = "1.9.0"
okhttp = "5.1.0"
retrofit = "3.0.0"
libphonenumber = "9.0.16"
minidns = "1.0.5"
# No proprietary Google libraries (GPL compliance, docs/LICENSING.md).
zxingEmbedded = "4.3.0"
coil = "3.3.0"
reorderable = "2.5.1"
securityCrypto = "1.1.0"
timber = "5.0.1"
